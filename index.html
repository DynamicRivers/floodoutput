<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood Depth Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f7f8; --ink: #13232f; --accent: #0a5c8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 12px 16px 16px;
    overflow: hidden;
  }
  header { flex: 0 0 auto; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 2px solid var(--accent); }
  .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; margin: 0; }
  h1 { font-size: 20px; line-height: 1.2; margin: 2px 0 0; }
  main { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; container-type: size; }
  video {
    display: block;
    width: min(100cqw, calc(100cqh * 1460 / 850));
    aspect-ratio: 1460 / 850;
    height: auto;
    border-radius: 6px;
    background: #0d1a22;
    box-shadow: 0 2px 12px rgba(0,0,0,.12);
  }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">Hydraulic modelling</p>
    <h1>Flood depth animation</h1>
  </header>
  <main>
    <video controls autoplay muted loop playsinline preload="auto" poster="media/lowther_poster.jpg">
      <source src="media/lowther_depth.mp4" type="video/mp4">
    </video>
  </main>
</body>
</html>
